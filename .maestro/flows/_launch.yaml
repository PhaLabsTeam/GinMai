# Shared: fresh, signed-out launch with location granted.
# In a dev build, clearing state also forgets the Metro URL, so reconnect to
# Metro and dismiss the dev-menu intro. Both steps no-op in a release build.
appId: com.ginmai.app
---
# Nimman, Chiang Mai. Without a fix, create-moment can't get coordinates (#39)
- setLocation:
    latitude: 18.7960
    longitude: 98.9680
- launchApp:
    clearState: true
    permissions:
      location: ${LOCATION || "inuse"}
      notifications: ${NOTIFICATIONS || "allow"}
- runFlow:
    when:
      notVisible: "Wanna eat?"
    commands:
      - openLink: "exp+ginmai://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
      - tapOn:
          text: "Open"
          optional: true
- extendedWaitUntil:
    visible: "Wanna eat?"
    timeout: 60000
- tapOn:
    text: "Continue"
    optional: true
# Dev menu sheet (its close button has no label)
- runFlow:
    when:
      visible: "Toggle element inspector"
    commands:
      # Hide the floating Tools button; it sits over the profile icon
      - scrollUntilVisible:
          element: "Tools button"
      - tapOn: "Tools button"
      - tapOn:
          point: "91%,11%"
- assertVisible: "Let's go"
# Dev-only error toast (console.error) can cover bottom buttons
- runFlow:
    when:
      visible: "Tap to dismiss|Dismiss"
    commands:
      - tapOn: "Dismiss"
