# Returning user sign-in (#2, #8, #15, #31).
# Needs the Supabase test number 66999999999 / 123456, whose profile already has
# a name. Returning users must not be asked for a name, and should land back on
# the screen that asked them to sign in.
appId: com.ginmai.app
---
- runFlow: _launch.yaml
- tapOn: "Let's go"
- tapOn: "Share location"
- extendedWaitUntil:
    visible: "Share where you're eating.*"
    timeout: 15000
- tapOn: "Share where you're eating.*"

# Step 1: phone only
- assertVisible: "Just a phone number."
- assertNotVisible: "First name"
- tapOn: "Phone number"
- inputText: "999999999"
- tapOn: "Continue"

# Step 2: code, shown with the country code (#31)
- extendedWaitUntil:
    visible: "We sent a code to \\+66 999 999 999"
    timeout: 15000
# The whole code in one fast burst, like paste or SMS autofill (#15)
- inputText: "123456"

# Returning user: no name step, back where sign-in started (#8)
- extendedWaitUntil:
    visible: "Share your .*"
    timeout: 15000
- assertNotVisible: "What should people call you?"
