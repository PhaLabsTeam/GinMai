# Shared: fresh launch, sign in as Tester, cancel every Moment Tester is hosting,
# open or full
appId: com.ginmai.app
---
- runFlow: _launch.yaml
- tapOn: "Let's go"
- tapOn: "Share location"
- extendedWaitUntil:
    visible: "Share where you're eating.*"
    timeout: 15000
- tapOn: "Share where you're eating.*"
- extendedWaitUntil:
    visible: "Phone number"
    timeout: 10000
- runFlow:
    file: _signin.yaml
    env:
      PHONE: "999999999"
      CODE: "123456"
- extendedWaitUntil:
    visible: "Share your .*"
    timeout: 15000
- tapOn: "Back"
# Through My Moments, which also finds full Moments (the map list shows only
# open ones, so a full table was never cleaned up)
- tapOn: "Menu"
- tapOn: "My Moments"
- repeat:
    while:
      notVisible: "Nothing planned right now."
    commands:
      - tapOn: ".*Cancel this meal.*"
      - tapOn: "Cancel meal"
      - extendedWaitUntil:
          visible: "Chiang Mai"
          timeout: 15000
      - tapOn: "Menu"
      - tapOn: "My Moments"
# Log out from the menu we're already on (_logout starts from the map)
- tapOn: "Settings"
- scrollUntilVisible:
    element: ".*Log out.*"
- tapOn: ".*Log out.*"
- tapOn:
    point: "68%,56%"
- extendedWaitUntil:
    visible: "Let's go"
    timeout: 15000
